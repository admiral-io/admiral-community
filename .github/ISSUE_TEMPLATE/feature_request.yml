name: Feature request
description: Suggest something Admiral should do, or do differently.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and what gets in your way. The problem matters more to us than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Workarounds, scripts, or other tools you use instead.
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: area
    attributes:
      label: Which part of Admiral does it touch?
      multiple: true
      options:
        - Web console
        - CLI
        - Kubernetes agent
        - Terraform provider
        - API or SDK (Go, TypeScript, OpenAPI)
        - Helm charts
        - Documentation or website
        - Not sure
